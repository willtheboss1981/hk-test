              '</div>'
            );
          }
          return (
            '<div class="rank-slot">' +
              '<span class="rank-slot-num">第 ' + (idx + 1) + ' 顺位</span>' +
              '<span>待点击</span>' +
            '</div>'
          );
        }).join('');

        const cardsHtml = MODULE3_VALUES.map(function (v) {
          const rankIdx = state.m3.indexOf(v.code);
          const isSelected = rankIdx !== -1;
          const badgeText = isSelected ? ('第' + (rankIdx + 1)) : '选择';
          return (
            '<button type="button" class="value-card' + (isSelected ? ' is-selected' : '') + '" data-vcode="' + v.code + '" aria-pressed="' + (isSelected ? 'true' : 'false') + '">' +
              '<div class="value-info">' +
                '<div class="value-title"><span class="value-code">' + v.code + '</span>' + escapeHtml(v.title) + '</div>' +
                '<div class="value-desc">' + escapeHtml(v.desc) + '</div>' +
              '</div>' +
              '<span class="rank-badge">' + badgeText + '</span>' +
            '</button>'
          );
        }).join('');

        mainStage.innerHTML =
          '<div class="fade-enter">' +
            '<div class="step-intro">' +
              '<div class="step-kicker">Module 03 · 8 选 3 并排序</div>' +
              '<h2 class="step-heading">长期驱动力与价值观筛选</h2>' +
              '<p class="step-sub">设想大学毕业工作 5 年后的理想状态，依次点击选出对你最重要的 <strong>3 项</strong>（再次点击已选项可取消，顺位会自动递补）。</p>' +
            '</div>' +
            '<div class="rank-summary-bar">' +
              '<div class="rank-summary-title">' +
                '<span>当前 Top 3 排序</span>' +
                '<span>已选 ' + state.m3.length + ' / 3</span>' +
              '</div>' +
              '<div class="rank-slots">' + slotsHtml + '</div>' +
            '</div>' +
            '<div class="value-grid">' + cardsHtml + '</div>' +
          '</div>';

        mainStage.querySelectorAll('.value-card').forEach(function (card) {
          card.addEventListener('click', function () {
            const code = card.getAttribute('data-vcode');
            const idx = state.m3.indexOf(code);
            if (idx !== -1) {
              // 取消选中并自动前移顺位
              state.m3.splice(idx, 1);
            } else {
              if (state.m3.length >= 3) {
                showToast('已选满 3 项，请先点击已选项取消后再替换');
                return;
              }
              state.m3.push(code);
            }
            saveState();
            renderModule3();
            updateNavigationChrome();
          });
        });
      }

      /* --- Step 7：实时评估报告页 --- */
      function renderReport() {
        const report = computeReport();
        const displayName = state.studentName.trim() ? (escapeHtml(state.studentName.trim()) + ' 的') : '个人';
        const today = new Date().toLocaleDateString('zh-CN');

        const radarSvg = buildRadarSvg(report.dims);
        const quadSvg = buildQuadrantSvg(report.coordX, report.coordY);

        const dimBarsHtml = report.dims.map(function (d) {
          const pct = Math.round((d.score / 20) * 100);
          return (
            '<div>' +
              '<div class="dim-row-top">' +
                '<span class="dim-name">' + d.key + '｜' + escapeHtml(d.name) + '</span>' +
                '<span class="dim-right">' +
                  '<span class="dim-score">' + d.score + '/20</span>' +
                  '<span class="tier-pill ' + d.tierClass + '">' + d.tier + '</span>' +
                '</span>' +
              '</div>' +
              '<div class="dim-bar-track">' +
                '<div class="dim-bar-fill" style="width:' + pct + '%;background:' + d.barColor + ';"></div>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        const valuesHtml = report.selectedValues.map(function (v) {
          return (
            '<div class="top-value-item">' +
              '<span class="tv-rank">第 ' + v.rank + '</span>' +
              '<div>' +
                '<div class="tv-title">' + v.code + ' ' + escapeHtml(v.title) + '</div>' +
                '<div class="tv-desc">' + escapeHtml(v.desc) + '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        const top1 = report.rankedClusters[0];
        const top2 = report.rankedClusters[1];

        function renderClusterCard(cluster, isPrimary) {
          const cls = isPrimary ? 'cluster-card is-primary' : 'cluster-card is-secondary';
          const tag = isPrimary ? 'Top 1 · 优先主攻专业族群' : 'Top 2 · 重点探索 / 备选族群';
          const tagsHtml = cluster.majors.map(function (m) {
            return '<span class="major-tag">' + escapeHtml(m) + '</span>';
          }).join('');
          return (
            '<div class="' + cls + '">' +
              '<span class="cluster-rank-tag">' + tag + '</span>' +
              '<h3 class="cluster-title">' + escapeHtml(cluster.name) + '</h3>' +
              '<div class="major-tags">' + tagsHtml + '</div>' +
              '<div class="cluster-note"><strong>数理化经选科提示：</strong>' + escapeHtml(cluster.note) + '</div>' +
            '</div>'
          );
        }

        const maxAff = Math.max(1, report.rankedClusters[0].affinity);
        const allClustersHtml = report.rankedClusters.map(function (c, i) {
          const relPct = Math.max(10, Math.min(99, Math.round((c.affinity / maxAff) * 96)));
          return (
            '<div class="mini-cluster-row">' +
              '<span>' + (i + 1) + '. ' + escapeHtml(c.name) + '</span>' +
              '<strong style="color:' + (i < 2 ? '#1B365D' : '#718096') + ';">相对匹配指数 ' + relPct + '</strong>' +
            '</div>'
          );
        }).join('');

        const alertsHtml = report.alerts.length > 0
          ? report.alerts.map(function (a) {
              return (
                '<section class="alert-card">' +
                  '<h3 class="alert-title">✦ ' + escapeHtml(a.title) + '</h3>' +
                  '<p class="alert-body">' + escapeHtml(a.body) + '</p>' +
                '</section>'
              );
            }).join('')
          : '';

        mainStage.innerHTML =
          '<div class="fade-enter">' +
            // 报告抬头
            '<section class="report-hero">' +
              '<div class="report-kicker">实时探索评估报告 · 数理化经专属模型</div>' +
              '<h1 class="report-title">' + displayName + '香港本科专业方向画像</h1>' +
              '<div class="report-meta-chips">' +
                '<span class="meta-chip">' + escapeHtml(state.studentGrade) + '</span>' +
                '<span class="meta-chip">A-Level 数学 · 物理 · 化学 · 经济</span>' +
                '<span class="meta-chip">' + escapeHtml(today) + '</span>' +
              '</div>' +
            '</section>' +

            // 特殊画像诊断卡片（命中时展示）
            alertsHtml +

            // 重点探索专业族群 Top 2
            '<section class="card">' +
              '<div class="section-title-bar">' +
                '<h2>香港本科专业族群匹配建议</h2>' +
                '<span class="section-badge">综合三模块计算</span>' +
              '</div>' +
              renderClusterCard(top1, true) +
              renderClusterCard(top2, false) +
              '<div class="all-clusters-list">' +
                '<div class="all-clusters-label">全部 6 大专业族群相对匹配排序</div>' +
                allClustersHtml +
              '</div>' +
            '</section>' +

            // 模块一：五维雷达图 + 水平进度条
            '<section class="card">' +
              '<div class="section-title-bar">' +
                '<h2>模块一 · 学科思维五维雷达</h2>' +
                '<span class="section-badge">满分 20 分/维</span>' +
              '</div>' +
              '<div class="svg-box">' + radarSvg + '</div>' +
              '<div class="dim-list">' + dimBarsHtml + '</div>' +
            '</section>' +

            // 模块二：二维体感坐标图
            '<section class="card">' +
              '<div class="section-title-bar">' +
                '<h2>模块二 · 真实体感二维坐标</h2>' +
                '<span class="section-badge">校准防失真</span>' +
              '</div>' +
              '<div class="svg-box">' + quadSvg + '</div>' +
              '<div class="axis-summary-grid">' +
                '<div class="axis-pill-card">' +
                  '<div class="axis-pill-label">纵轴 · 原理 vs. 应用</div>' +
                  '<div class="axis-pill-val">' + escapeHtml(report.vLabel) + '</div>' +
                  '<div class="axis-pill-sub">原理 A：' + report.countA_v + ' 题 ｜ 应用 B：' + report.countB_v + ' 题</div>' +
                '</div>' +
                '<div class="axis-pill-card">' +
                  '<div class="axis-pill-label">横轴 · 系统 vs. 人际</div>' +
                  '<div class="axis-pill-val">' + escapeHtml(report.hLabel) + '</div>' +
                  '<div class="axis-pill-sub">系统 A：' + report.countA_h + ' 题 ｜ 市场 B：' + report.countB_h + ' 题</div>' +
                '</div>' +
              '</div>' +
            '</section>' +

            // 模块三：价值观 Top 3
            '<section class="card">' +
              '<div class="section-title-bar">' +
                '<h2>模块三 · 核心驱动力 Top 3</h2>' +
                '<span class="section-badge">长期价值观锚点</span>' +
              '</div>' +
              '<div class="top-values-list">' + valuesHtml + '</div>' +
            '</section>' +

            // 分享与导出操作区（打印时隐藏）
            '<section class="card no-print">' +
              '<div class="section-title-bar">' +
                '<h2>保存与转发给家长 / 顾问</h2>' +
              '</div>' +
              '<div class="action-stack">' +
                '<button type="button" id="btnCopyReport" class="btn-primary btn-gold">一键复制结果报告（适配微信粘贴）</button>' +
                '<div class="action-row-2">' +
                  '<button type="button" id="btnPrintReport" class="btn-secondary">打印 / 保存 PDF</button>' +
                  '<button type="button" id="btnRestart" class="btn-secondary">重新测试</button>' +
                '</div>' +
              '</div>' +
            '</section>' +

            // 合规边界声明
            '<footer class="compliance-footer">' +
              '<strong>使用边界声明：</strong>本问卷为基于公开生涯心理学理论设计的结构化自我探索工具，用于辅助家庭将宽泛的选科能力收敛为 1–2 个专业族群，不构成标准化心理诊断，也不代表任何院校的录取偏好；具体专业的科目先修要求与招生口径，以院校及香港入境事务处等官方当期发布为准。' +
            '</footer>' +
          '</div>';

        // 绑定报告操作事件
        document.getElementById('btnCopyReport').addEventListener('click', function () {
          const shareText = buildShareText(report);
          copyTextToClipboard(shareText);
        });

        document.getElementById('btnPrintReport').addEventListener('click', function () {
          try {
            window.print();
          } catch (err) {
            showToast('当前浏览器不支持直接打印，请使用「一键复制结果报告」');
          }
        });

        document.getElementById('btnRestart').addEventListener('click', function () {
          document.getElementById('resetModal').classList.add('is-open');
        });
      }

      /* ========================================================================
         八、校验与导航路由控制
         ======================================================================== */
      function validateCurrentStep() {
        const missingIds = [];

        if (state.step >= 1 && state.step <= 4) {
          const start = (state.step - 1) * 5;
          const pageQs = MODULE1_QUESTIONS.slice(start, start + 5);
          pageQs.forEach(function (q) {
            if (!state.m1[q.id]) missingIds.push(q.id);
          });
        } else if (state.step === 5) {
          MODULE2_QUESTIONS.forEach(function (q) {
            if (!state.m2[q.id]) missingIds.push(q.id);
          });
        } else if (state.step === 6) {
          if (state.m3.length < 3) {
            showToast('请先选择并排序 3 项核心价值观');
            return false;
          }
        }

        if (missingIds.length > 0) {
          missingIds.forEach(function (id) {
            const card = document.getElementById('qcard-' + id);
            if (card) {
              card.classList.remove('is-missing');
              // 强制重排以重新触发抖动动画
              void card.offsetWidth;
              card.classList.add('is-missing');
            }
          });
          const firstCard = document.getElementById('qcard-' + missingIds[0]);
          if (firstCard) {
            firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          showToast('还有 ' + missingIds.length + ' 题未作答，已为你标亮定位');
          return false;
        }

        return true;
      }

      function goToStep(nextStep) {
        state.step = nextStep;
        saveState();
        renderCurrentScreen();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderCurrentScreen() {
        updateNavigationChrome();
        if (state.step === 0) {
          renderCover();
        } else if (state.step >= 1 && state.step <= 4) {
          renderModule1Page(state.step);
        } else if (state.step === 5) {
          renderModule2();
        } else if (state.step === 6) {
          renderModule3();
        } else if (state.step === 7) {
          renderReport();
        }
      }

      // 绑定底部翻页按钮
      btnPrev.addEventListener('click', function () {
        if (state.step > 0) {
          goToStep(state.step - 1);
        }
      });

      btnNext.addEventListener('click', function () {
        if (!validateCurrentStep()) return;
        if (state.step < 7) {
          goToStep(state.step + 1);
        }
      });

      // 绑定重置弹窗事件
      const resetModal = document.getElementById('resetModal');
      document.getElementById('btnCancelReset').addEventListener('click', function () {
        resetModal.classList.remove('is-open');
      });

      document.getElementById('btnConfirmReset').addEventListener('click', function () {
        resetModal.classList.remove('is-open');
        state = createInitialState();
        saveState();
        renderCurrentScreen();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('已清空记录，可重新开始测评');
      });

      resetModal.addEventListener('click', function (e) {
        if (e.target === resetModal) {
          resetModal.classList.remove('is-open');
        }
      });

      // 初始启动：如果历史进度已停在结果页但数据不完整，安全回退到封面
      const isReportComplete =
        Object.keys(state.m1).length === 20 &&
        Object.keys(state.m2).length === 8 &&
        state.m3.length === 3;
      if (state.step === 7 && !isReportComplete) {
        state.step = 0;
      }
      renderCurrentScreen();
    })();
  </script>
</body>
</html>
